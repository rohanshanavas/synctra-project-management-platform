name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            # Get the repository onto the GitHub Actions runner
            - name: Checkout repository
              uses: actions/checkout@v4

            # Install the same major Node.js version and cache dependencies
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      frontend/package-lock.json
                      backend/package-lock.json

            # ----------------------------------------
            # Frontend
            # ----------------------------------------

            # Install frontend dependencies
            - name: Install frontend dependencies
              working-directory: ./frontend
              run: npm ci

            # Run frontend tests
            - name: Run frontend tests
              working-directory: ./frontend
              run: npm test

            # Build the frontend
            - name: Build frontend
              working-directory: ./frontend
              env:
                  VITE_API_URL: http://localhost:5000/api-v1
              run: npm run build

            # ----------------------------------------
            # Backend
            # ----------------------------------------

            # Install backend dependencies
            - name: Install backend dependencies
              working-directory: ./backend
              run: npm ci

            # Test backend endpoints
            - name: Run backend tests
              working-directory: ./backend
              run: npm test

            # ----------------------------------------
            # Docker
            # ----------------------------------------

            # Build the backend Docker image
            - name: Build backend Docker image
              run: docker build -t synctra-backend ./backend

            # Build the frontend Docker image
            - name: Build frontend Docker image
              run: docker build --build-arg VITE_API_URL=http://localhost:5000/api-v1 -t synctra-frontend ./frontend
