name: CI/CD

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            # ----------------------------------------
            # Checkout
            # ----------------------------------------

            - name: Checkout repository
              uses: actions/checkout@v4

            # ----------------------------------------
            # Node.js
            # ----------------------------------------

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      frontend/package-lock.json
                      backend/package-lock.json

            # ----------------------------------------
            # Frontend
            # ----------------------------------------

            - name: Install frontend dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Run frontend tests
              working-directory: ./frontend
              run: npm test

            - name: Build frontend
              working-directory: ./frontend
              env:
                  VITE_API_URL: http://localhost:5000/api-v1
              run: npm run build

            # ----------------------------------------
            # Backend
            # ----------------------------------------

            - name: Install backend dependencies
              working-directory: ./backend
              run: npm ci

            - name: Run backend tests
              working-directory: ./backend
              run: npm test

            # ----------------------------------------
            # AWS
            # ----------------------------------------

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: arn:aws:iam::643285091347:role/GitHubActions-Synctra
                  aws-region: eu-west-1

            # ----------------------------------------
            # ECR
            # ----------------------------------------

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            # ----------------------------------------
            # Backend Docker image
            # ----------------------------------------

            - name: Build, tag, and push backend image
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  REPOSITORY: synctra-backend
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./backend
                  docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

            # ----------------------------------------
            # Frontend Docker image
            # ----------------------------------------

            - name: Build, tag, and push frontend image
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  REPOSITORY: synctra-frontend
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build --build-arg VITE_API_URL=/api-v1 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./frontend
                  docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

            # ----------------------------------------
            # Kubernetes
            # ----------------------------------------

            - name: Configure kubectl
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: aws eks update-kubeconfig --region eu-west-1 --name synctra-dev-eks

            - name: Verify EKS access
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: kubectl get nodes

            # ----------------------------------------
            # Deploy backend
            # ----------------------------------------

            - name: Deploy backend to EKS
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: kubectl set image deployment/backend backend=$REGISTRY/synctra-backend:$IMAGE_TAG -n synctra

            # ----------------------------------------
            # Deploy frontend
            # ----------------------------------------

            - name: Deploy frontend to EKS
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: kubectl set image deployment/frontend frontend=$REGISTRY/synctra-frontend:$IMAGE_TAG -n synctra

            # ----------------------------------------
            # Verify deployments
            # ----------------------------------------

            - name: Verify backend rollout
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: kubectl rollout status deployment/backend -n synctra --timeout=5m

            - name: Verify frontend rollout
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: kubectl rollout status deployment/frontend -n synctra --timeout=5m
