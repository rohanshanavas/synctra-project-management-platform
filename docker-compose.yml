services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "5000:5000"
        env_file:
            - ./backend/.env

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: http://localhost:5000/api-v1
        ports:
            - "3000:3000"
        
