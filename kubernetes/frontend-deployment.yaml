apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: synctra

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 643285091347.dkr.ecr.eu-west-1.amazonaws.com/synctra-frontend:311e265644c968a3388ae927dde950ab22149947

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
