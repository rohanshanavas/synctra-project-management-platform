apiVersion: v1
kind: Pod
metadata:
  name: backend-secrets-bootstrap
  namespace: synctra
spec:
  serviceAccountName: backend
  restartPolicy: Never

  containers:
    - name: secret-sync
      image: public.ecr.aws/docker/library/busybox:1.36

      command:
        - /bin/sh
        - -c
        - |
          echo "Mounting Secrets Manager secret..."
          sleep 30
          echo "Secret sync bootstrap complete."

      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"

      volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true

  volumes:
    - name: secrets-store
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: backend-secrets
