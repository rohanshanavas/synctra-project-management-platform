apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: synctra

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: 643285091347.dkr.ecr.eu-west-1.amazonaws.com/synctra-backend:07c779e7dac9269cc745e3275d8401065380b23d

          ports:
            - containerPort: 5000

          envFrom:
            - secretRef:
                name: backend-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
